<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Academic Planning Assistant</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500&display=swap">
    <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
    <header class="navbar">
        <div class="navbar-logo">
            <h1>Academic Planner</h1>
        </div>
    </header>

    <main class="main-content">
        <div class="hero">
            <h2>Your Path to Academic Success</h2>
            <p>Upload your degree audit and let us handle the planning for you.</p>
        </div>

        <div class="upload-section">
            <h2>Upload Degree Audit</h2>
            <form id="uploadForm" enctype="multipart/form-data">
                <input type="file" id="degreeAuditUpload" accept=".pdf">
                <button type="button" onclick="uploadDegreeAudit()">Upload</button>
            </form>
            <p id="loading" class="loading" style="display: none;">Processing your upload...</p>
        </div>

        <div class="response-section">
            <h2>Semester Plan</h2>
            <div id="responseArea" class="response-area">
                <p>Your semester plan will appear here.</p>
            </div>
        </div>

        <div class="flowchart-section">
            <h2>Visual Flowchart</h2>
            <div id="flowchartContainer" class="flowchart-container"></div>
        </div>
    </main>

    <footer class="footer">
        <p>&copy; 2024 Academic Planner. Designed for Student Success.</p>
    </footer>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jsPlumb/2.15.6/js/jsplumb.min.js"></script>
    <script src="/static/script.js"></script>
</body>
</html>
